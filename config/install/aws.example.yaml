# Example AWS install-time configuration.
# Select exactly one provider per installation (aws OR gcp, never both).
cloud_provider: aws
environment: prod
# single_host: one VM (small teams). scale_out: Fargate coding workers and
# replicated services (aws only).
deployment_profile: single_host
project_name: ts-harness
cloud_region: us-east-1
cloud_zone: us-east-1a
aws_account_id: "123456789012"
secret_prefix: ts-harness
notification_email: ops@example.com
monthly_budget_limit: 500

# Only read when deployment_profile is scale_out (network_mode then defaults to vpc).
# Moving an existing single_host install to vpc replaces the host and RDS subnet group.
# scale_out:
#   network_mode: vpc
#   vpc_cidr: 10.40.0.0/16
#   coding_worker_image_tag: latest   # CI sets TS_HARNESS_CODING_WORKER_IMAGE_TAG
#   memory_api_certificate_arn: ""    # ACM cert for the internal memory API load balancer
#   egress_allowed_domains: []        # added to the GitHub, npm, PyPI and LLM defaults

# GitHub App used for clone, push and PRs. Put the private key and webhook
# secret in <secret_prefix>/github-app-private-key and github-app-webhook-secret.
# Without it, the github-token PAT is used. See docs/runbooks/github-app.md.
# github_app:
#   app_id: "123456"
#   slug: ts-harness-acme

vm:
  instance_type: t3.medium
  root_volume_size_gb: 40
  data_disk_size_gb: 60
  admin_username: artemis
  ssh_key_name: ts-harness-prod
  ssh_allowed_cidrs:
    - 10.0.0.0/8
  # tailscale_authkey_secret_ref: arn:aws:secretsmanager:us-east-1:123456789012:secret:tailscale

managed_db:
  instance_class: db.t3.micro
  db_name: ts_harness
  db_username: ts_harness
  backup_retention_days: 7
  # multi_az defaults to true. Set false on a dev account.
  # apply_immediately: false
  backup_window: "03:00-04:00"
  skip_final_snapshot: false
  engine_version: "16"

terraform_state:
  backend_type: s3
  bucket: example-ts-harness-tfstate
  key: prod/aws/terraform.tfstate
  region: us-east-1
  # Locking defaults to S3-native lockfiles (terraform >= 1.10).
  # On older terraform, name an existing DynamoDB table instead:
  # lock_table: terraform-locks

runtime:
  agent_runtime_version: "0.1.0"
  enterprise_repo_url: https://github.com/TribalScale/ts-harness.git
  multi_agent_enabled: true
  workflow_runner_enabled: true
  workflow_runner_poll_interval_seconds: 10
  workflow_runner_batch_size: 5
  workflow_runner_lease_seconds: 1800
  workflow_runner_stale_policy: block
  # OpenCode runs as queued jobs in worker containers; turn on after one supervised run.
  coding_jobs_enabled: false
  coding_max_running: 3
  embeddings_provider: openai
  embeddings_model: text-embedding-3-small
  embeddings_dimensions: 1536
  embeddings_fallback: none
  agent_timezone: UTC
  implement_work_orders_repo_url: ""
  implement_work_orders_base_branch: main
  slack_standup_channel: ""
  slack_ops_channel: ""
  slack_dev_channel: ""
  slack_team_channel: ""
  slack_marketing_channel: ""
  slack_sales_channel: ""
  approved_slack_channels: []
  # Admin identity (Auth0/OIDC). Leave static unless you set all oidc_* fields.
  identity_provider: static
  oidc_issuer: ""
  oidc_audience: ""
  oidc_jwks_url: ""
  oidc_client_id: ""
  oidc_authorization_endpoint: ""
  oidc_token_endpoint: ""
