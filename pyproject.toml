[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-harness"
version = "0.1.0"
description = "TS Harness: governed multi-agent control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sadiq Oyapero", email = "soyapero@tribalscale.com" },
  { name = "TribalScale" },
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "httpx>=0.27",
    "croniter>=2.0",
    "PyJWT[crypto]>=2.8",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "cryptography>=42.0",
    "redis>=5.0",
    "psycopg-pool>=3.2",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "slack-bolt>=1.21,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "psycopg[binary]>=3.2",
    "ruff>=0.4",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
]
mcp = [
    "mcp>=1.0",
]
google = [
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
]
eval = [
    "inspect-ai>=0.3",
]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
docker = [
    "docker>=7.0",
]

[project.scripts]
ts-harness = "ts_harness.gateway.server:main"

[tool.setuptools.packages.find]
where = ["runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["runtime", "scripts"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
