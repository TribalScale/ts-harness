# Re-resolve agent-runtime through Docker DNS: bootstrap and ops scripts
# recreate that container, and a startup-time lookup would keep its old IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# agent-runtime-2 exists only with docker-compose.replicas.yml. A name that does
# not resolve stays out of rotation until it does.
upstream agent_runtime {
    zone agent_runtime 64k;
    server agent-runtime:18789 resolve;
    server agent-runtime-2:18789 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bare console paths are hash screens. Exact matches stay off the API proxy.
    # Quote the target so nginx does not treat # as a comment.
    location = /admin/cron { return 302 "/#/system/cron"; }
    location = /admin/mcp { return 302 "/#/system/mcp"; }
    location = /admin/settings { return 302 "/#/system/settings"; }

    # Same-origin API proxy to agent-runtime (no localhost in the browser)
    location /admin/ {
        proxy_pass http://agent_runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 300s;
    }

    location /healthz {
        proxy_pass http://agent_runtime;
        proxy_set_header Host $host;
    }

    location /session/ {
        proxy_pass http://agent_runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /cron/ {
        proxy_pass http://agent_runtime;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /workflow/ {
        proxy_pass http://agent_runtime;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /metrics {
        proxy_pass http://agent_runtime;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Remaining gateway routes, so a tailnet URL fronted by this console still
    # reaches OAuth callbacks, SCIM, webhooks, and channel endpoints.
    location ~ ^/(channels|connectors|mcp|memory|oauth|sandbox|scim|skills|webhooks)(/|$) {
        proxy_pass http://agent_runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 300s;
    }
}
