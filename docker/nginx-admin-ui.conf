server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bare console paths are hash screens. Exact matches stay off the API proxy.
    # Quote the target so nginx does not treat # as a comment.
    location = /admin/cron { return 302 "/#/system/cron"; }
    location = /admin/mcp { return 302 "/#/system/mcp"; }
    location = /admin/settings { return 302 "/#/system/settings"; }

    # Same-origin API proxy to agent-runtime (no localhost in the browser)
    location /admin/ {
        proxy_pass http://agent-runtime:18789/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 300s;
    }

    location /healthz {
        proxy_pass http://agent-runtime:18789/healthz;
        proxy_set_header Host $host;
    }

    location /session/ {
        proxy_pass http://agent-runtime:18789/session/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /cron/ {
        proxy_pass http://agent-runtime:18789/cron/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /workflow/ {
        proxy_pass http://agent-runtime:18789/workflow/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /metrics {
        proxy_pass http://agent-runtime:18789/metrics;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
