# Local development Postgres + pgvector (MEMORY_BACKEND=local).
# Selected by scripts/phases/12-compose-up.sh — not used for production managed DB installs.
services:
  ts-harness-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${TS_HARNESS_DB_USER:-ts_harness}
      POSTGRES_PASSWORD: ${TS_HARNESS_DB_PASSWORD:?set TS_HARNESS_DB_PASSWORD}
      POSTGRES_DB: ${TS_HARNESS_DB_NAME:-ts_harness_memory}
    volumes:
      - ts-harness-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  ts-harness-db-data:
