services:
  # Fargate coding workers reach memory-api through the internal load balancer,
  # so it listens on all interfaces of the agent-runtime network namespace and
  # the host publishes the port. The host security group admits only the load
  # balancer, which forwards /health and /coding-jobs/* alone.
  agent-runtime:
    ports:
      - "${MEMORY_API_PUBLISH_PORT:-18792}:18792"

  memory-api:
    environment:
      MEMORY_API_BIND: 0.0.0.0
