# Metering LLM proxy. Included by phase 12 when LLM_PROXY_ENABLED=true.
#
# It shares agent-runtime's network namespace: the runtime and local coding
# workers call http://127.0.0.1:18795/llm, a runtime replica calls
# http://agent-runtime:18795/llm, and ECS coding workers reach it through the
# internal load balancer (host port LLM_PROXY_HOST_PORT). Provider keys live
# here; callers hold short-lived proxy tokens minted with LLM_PROXY_SECRET.
services:
  llm-proxy:
    image: ts-harness-agent-runtime:latest
    network_mode: "service:agent-runtime"
    command: ["python3", "-m", "ts_harness.llm_proxy"]
    environment:
      LLM_PROXY_BIND: 0.0.0.0
      LLM_PROXY_PORT: "18795"
      LLM_PROXY_DB_URL: ${TS_HARNESS_SESSION_DB_URL:-}
      TS_HARNESS_CONFIG: /config/ts-harness-runtime.yaml
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
    # LLM_PROXY_SECRET and provider keys (OPENROUTER_API_KEY, CODING_BACKEND_*) load from env_file.
    env_file:
      - ${TS_HARNESS_CONFIG_DIR:?set TS_HARNESS_CONFIG_DIR}/.env
    volumes:
      - ${TS_HARNESS_CONFIG_DIR:?set TS_HARNESS_CONFIG_DIR}/ts-harness-runtime.yaml:/config/ts-harness-runtime.yaml:ro
    restart: unless-stopped
    depends_on:
      - agent-runtime
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18795/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-runtime:
    ports:
      # Loopback-only unless the internal load balancer forwards /llm/* to this host (scale_out).
      - "${LLM_PROXY_HOST_PORT:-127.0.0.1:18795}:18795"
    environment:
      LLM_PROXY_URL: http://127.0.0.1:18795/llm
