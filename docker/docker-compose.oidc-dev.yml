# Local OIDC issuer for development only; stands in for Auth0.
# Usage (repo root):
#   ENTERPRISE_ASSETS_DIR=$PWD docker compose -f docker/docker-compose.oidc-dev.yml up -d
# Then point identity.issuer at http://localhost:9400/ (see docs/runbooks/oidc-dev-issuer.md).
services:
  oidc-dev-issuer:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --quiet 'PyJWT[crypto]>=2.8' &&
             python scripts/dev/oidc-dev-issuer.py
             --issuer ${OIDC_DEV_ISSUER:-http://localhost:9400/}
             --port 9400 --key-file /keys/dev-issuer.pem"
    volumes:
      - ${ENTERPRISE_ASSETS_DIR:?set ENTERPRISE_ASSETS_DIR}/scripts/dev:/app/scripts/dev:ro
      - oidc-dev-keys:/keys
    ports:
      - "127.0.0.1:9400:9400"
    restart: unless-stopped

volumes:
  oidc-dev-keys:
