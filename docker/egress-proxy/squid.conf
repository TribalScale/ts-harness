# Coding worker egress proxy (docker/docker-compose.coding-egress.yml).
# Workers on the internal coding-egress network reach the internet only through
# this proxy, and only the domains in the allowlist file coding-launcher writes
# (runtime/ts_harness/coding/egress.py). Denied requests log as TCP_DENIED/403.
http_port 3128
pid_filename none
cache deny all
cache_log stdio:/dev/stderr
logformat egress %ts.%03tu %>a %Ss/%>Hs %rm %ru
access_log stdio:/dev/stdout egress
logfile_rotate 0
# Do not advertise the proxy or the client in forwarded requests.
via off
forwarded_for delete

acl safe_ports port 80 443
acl ssl_ports port 443
acl CONNECT method CONNECT
acl allowed dstdomain "/etc/squid/allowlist/domains.txt"

http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access allow allowed
http_access deny all
